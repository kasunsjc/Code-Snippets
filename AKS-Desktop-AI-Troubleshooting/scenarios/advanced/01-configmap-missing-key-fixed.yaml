# Advanced scenario 01 (FIXED): add the DB_URL key that the deployment consumes.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo-advanced
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: ai-demo-advanced
data:
  APP_MODE: "production"
  LOG_LEVEL: "info"
  DB_URL: "postgres://payments.ai-demo-advanced.svc.cluster.local:5432/payments"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ai-demo-advanced
  labels:
    app: payment-service
    scenario: advanced-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=payment ok"]
          ports:
            - containerPort: 5678
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: DB_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
