# Advanced scenario 07 (BROKEN): CronJob references a Secret that does not exist.
# Expected symptom: job pod stays in CreateContainerConfigError.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo-advanced
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-job
  namespace: ai-demo-advanced
  labels:
    app: report-job
    scenario: advanced-07
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo running with token $API_TOKEN"]
              env:
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      # Intentional failure: this Secret is not created anywhere.
                      name: report-secrets
                      key: token
