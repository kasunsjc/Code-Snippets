# Advanced scenario 03 (FIXED): align Service selector with the pod labels.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo-advanced
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: ai-demo-advanced
  labels:
    app: search-service
    scenario: advanced-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=search ok"]
          ports:
            - containerPort: 5678
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: ai-demo-advanced
spec:
  selector:
    app: search-service
  ports:
    - port: 80
      targetPort: 5678
