# Advanced scenario 07 (FIXED): create the referenced Secret so containers can start.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo-advanced
---
apiVersion: v1
kind: Secret
metadata:
  name: report-secrets
  namespace: ai-demo-advanced
type: Opaque
stringData:
  token: "demo-token-value"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-job
  namespace: ai-demo-advanced
  labels:
    app: report-job
    scenario: advanced-07
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo running with token $API_TOKEN"]
              env:
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: report-secrets
                      key: token
