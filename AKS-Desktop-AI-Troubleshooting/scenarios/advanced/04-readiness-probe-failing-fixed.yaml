# Advanced scenario 04 (FIXED): probe a path the container actually serves.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo-advanced
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: ai-demo-advanced
  labels:
    app: checkout-service
    scenario: advanced-04
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: ai-demo-advanced
spec:
  selector:
    app: checkout-service
  ports:
    - port: 80
      targetPort: 80
