# Advanced scenario 06 (FIXED): raise memory request/limit above the working set.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo-advanced
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: ai-demo-advanced
  labels:
    app: analytics-worker
    scenario: advanced-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      containers:
        - name: worker
          image: polinux/stress:latest
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "0"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 320Mi
