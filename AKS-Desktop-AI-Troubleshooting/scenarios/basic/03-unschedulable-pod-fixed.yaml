# Basic scenario 03 (FIXED): remove the invalid nodeSelector so the pod can be scheduled.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ai-demo
  labels:
    app: notification-service
    demo: aks-desktop-ai
    scenario: basic-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
