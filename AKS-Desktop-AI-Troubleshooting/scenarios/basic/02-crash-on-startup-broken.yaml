# Basic scenario 02 (BROKEN): container command exits non-zero on start -> CrashLoopBackOff.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ai-demo
  labels:
    app: order-service
    demo: aks-desktop-ai
    scenario: basic-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # Intentional failure: process exits 1 immediately, kubelet keeps restarting it.
          command: ["/bin/sh", "-c", "echo 'startup failed'; exit 1"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
