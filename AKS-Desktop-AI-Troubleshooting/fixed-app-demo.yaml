apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: ai-demo
  labels:
    app: broken-image
    demo: aks-desktop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: app
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-loop
  namespace: ai-demo
  labels:
    app: crash-loop
    demo: aks-desktop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-loop
  template:
    metadata:
      labels:
        app: crash-loop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do echo 'demo app is running'; sleep 30; done"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-pod
  namespace: ai-demo
  labels:
    app: pending-pod
    demo: aks-desktop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-pod
  template:
    metadata:
      labels:
        app: pending-pod
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: broken-image-svc
  namespace: ai-demo
spec:
  selector:
    app: broken-image
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
