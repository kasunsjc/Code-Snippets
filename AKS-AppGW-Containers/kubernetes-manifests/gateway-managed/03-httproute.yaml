# HTTPRoute — path-based and header-based routing demo (ALB managed)
# Matches the MS Learn path/header routing quick-start examples
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route
  namespace: test-infra
spec:
  parentRefs:
    - name: gateway-01
  rules:
    # Path-based routing: /bar -> backend-v2
    - matches:
        - path:
            type: PathPrefix
            value: /bar
      backendRefs:
        - name: backend-v2
          port: 8080
    # Header + query param + path routing -> backend-v2
    - matches:
        - headers:
            - type: Exact
              name: magic
              value: foo
          queryParams:
            - type: Exact
              name: great
              value: example
          path:
            type: PathPrefix
            value: /some/thing
      backendRefs:
        - name: backend-v2
          port: 8080
    # Default route -> backend-v1
    - backendRefs:
        - name: backend-v1
          port: 8080
