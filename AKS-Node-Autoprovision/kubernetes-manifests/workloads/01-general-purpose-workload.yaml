# Generic workload with no special node requirements.
# NAP schedules it onto the highest-weight matching NodePool (general-purpose).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: general-purpose-demo
  labels:
    app: general-purpose-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: general-purpose-demo
  template:
    metadata:
      labels:
        app: general-purpose-demo
    spec:
      containers:
        - name: nginx
          image: mcr.microsoft.com/oss/nginx/nginx:1.25
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: general-purpose-demo
spec:
  selector:
    app: general-purpose-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
