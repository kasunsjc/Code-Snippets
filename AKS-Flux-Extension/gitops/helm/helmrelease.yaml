# Installs the chart from the GitRepository above. Values here override the chart's values.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubeplay
  namespace: kubeplay
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/kubeplay
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: kubeplay-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      # Replace with an ACR attached to the AKS cluster (az aks update --attach-acr).
      imageRegistry: ACR_NAME.azurecr.io
      imageTag: "0.1.1"
      imagePullPolicy: Always
    ui:
      title: KubePlay via Flux
    inspector:
      replicas: 3
    redis:
      storage:
        storageClass: managed-csi
    ingress:
      enabled: false
