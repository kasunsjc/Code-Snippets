name: Weekly Bicep What-If Validation

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8:00 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  id-token: write
  contents: read
  issues: write

env:
  WHATIF_RESULTS_DIR: /tmp/whatif-results

jobs:
  whatif-validation:
    name: Bicep What-If Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: Run What-If Validation
        id: whatif
        run: |
          set -e
          mkdir -p "$WHATIF_RESULTS_DIR"

          overall_status=0
          summary=""

          # -------------------------------------------------------
          # 1. Validate Bicep files that have matching .bicepparam
          # -------------------------------------------------------
          while IFS= read -r -d '' paramfile; do
            dir=$(dirname "$paramfile")
            bicepfile=""

            # Resolve the bicep file referenced in the .bicepparam
            using_ref=$(grep -m1 "^using " "$paramfile" | sed "s/using '\\(.*\\)'/\\1/" | xargs)
            if [[ -n "$using_ref" ]]; then
              bicepfile="$dir/$using_ref"
            fi

            if [[ ! -f "$bicepfile" ]]; then
              echo "⚠️  Could not resolve bicep file for $paramfile — skipping"
              continue
            fi

            deployment_name=$(basename "$dir" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
            result_file="$WHATIF_RESULTS_DIR/${deployment_name}.txt"

            # Determine target scope from the bicep file
            target_scope=$(grep -m1 'targetScope' "$bicepfile" | sed "s/.*= *'\\(.*\\)'/\\1/" | xargs)

            echo ""
            echo "==========================================="
            echo "📦 Deployment: $dir"
            echo "   Bicep:  $bicepfile"
            echo "   Params: $paramfile"
            echo "   Scope:  ${target_scope:-resourceGroup}"
            echo "==========================================="

            if [[ "$target_scope" == "subscription" ]]; then
              # Subscription-scoped deployment
              location=$(grep -m1 "param location" "$paramfile" | sed "s/.*= *'\\(.*\\)'/\\1/" | xargs)
              location="${location:-westeurope}"

              if az deployment sub what-if \
                --location "$location" \
                --template-file "$bicepfile" \
                --parameters "$paramfile" \
                --no-pretty-print \
                > "$result_file" 2>&1; then
                echo "✅ What-If succeeded for $dir"
                summary="${summary}✅ ${dir}\n"
              else
                echo "❌ What-If FAILED for $dir"
                summary="${summary}❌ ${dir}\n"
                overall_status=1
              fi
            else
              # Resource group-scoped deployment
              resource_group="${AZURE_RESOURCE_GROUP:-rg-bicep-whatif-validation}"

              if az deployment group what-if \
                --resource-group "$resource_group" \
                --template-file "$bicepfile" \
                --parameters "$paramfile" \
                --no-pretty-print \
                > "$result_file" 2>&1; then
                echo "✅ What-If succeeded for $dir"
                summary="${summary}✅ ${dir}\n"
              else
                echo "❌ What-If FAILED for $dir"
                summary="${summary}❌ ${dir}\n"
                overall_status=1
              fi
            fi
          done < <(find . -name '*.bicepparam' -not -path './.git/*' -print0)

          # -------------------------------------------------------
          # 2. Bicep build validation for files without .bicepparam
          # -------------------------------------------------------
          while IFS= read -r -d '' bicepfile; do
            dir=$(dirname "$bicepfile")
            # Skip if this directory already has a .bicepparam file
            if find "$dir" -maxdepth 1 -name '*.bicepparam' | grep -q .; then
              continue
            fi

            deployment_name=$(echo "$bicepfile" | sed 's|^\./||' | tr '/' '-' | sed 's/\.bicep$//' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
            result_file="$WHATIF_RESULTS_DIR/${deployment_name}-build.txt"

            echo ""
            echo "==========================================="
            echo "🔨 Build Validation: $bicepfile"
            echo "==========================================="

            if az bicep build --file "$bicepfile" --stdout > /dev/null 2> "$result_file"; then
              echo "✅ Build succeeded for $bicepfile"
              summary="${summary}✅ ${bicepfile} (build only)\n"
            else
              echo "❌ Build FAILED for $bicepfile"
              summary="${summary}❌ ${bicepfile} (build only)\n"
              overall_status=1
            fi
          done < <(find . -name '*.bicep' -not -name '*.bicepparam' -not -path './.git/*' -not -path '*/modules/*' -print0)

          # Save summary for the issue creation step
          echo -e "$summary" > "$WHATIF_RESULTS_DIR/summary.txt"

          if [[ $overall_status -ne 0 ]]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

          exit $overall_status

      - name: Create GitHub Issue on Failure
        if: failure() && steps.whatif.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsDir = process.env.WHATIF_RESULTS_DIR;
            let summary = '';
            let details = '';

            // Read summary
            const summaryFile = path.join(resultsDir, 'summary.txt');
            if (fs.existsSync(summaryFile)) {
              summary = fs.readFileSync(summaryFile, 'utf8').trim();
            }

            // Read individual result files for failure details
            const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.txt') && f !== 'summary.txt');
            for (const file of files) {
              const content = fs.readFileSync(path.join(resultsDir, file), 'utf8').trim();
              if (content) {
                details += `\n<details>\n<summary>📄 ${file}</summary>\n\n\`\`\`\n${content}\n\`\`\`\n</details>\n`;
              }
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split('T')[0];

            const body = `## 🔴 Weekly Bicep What-If Validation Failed

            **Date:** ${today}
            **Workflow Run:** [View Logs](${runUrl})

            ### Summary

            ${summary}

            ### Failure Details
            ${details}

            ### Next Steps
            - Review the failed Bicep templates listed above
            - Check for deprecated API versions, removed properties, or invalid configurations
            - Fix the issues and push changes to the \`main\` branch
            - The next scheduled run will verify the fixes

            ---
            *This issue was automatically created by the [Weekly Bicep What-If Validation](${runUrl}) workflow.*
            `.replace(/^            /gm, '');

            // Check for existing open issues with the same label to avoid duplicates
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bicep-validation-failure',
              per_page: 1
            });

            if (existingIssues.data.length > 0) {
              // Update the existing issue instead of creating a new one
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                body: body
              });
              console.log(`Updated existing issue #${existingIssues.data[0].number}`);
            } else {
              // Create a new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 Bicep What-If Validation Failed — ${today}`,
                body: body,
                labels: ['bicep-validation-failure']
              });
              console.log('Created new issue for Bicep validation failure');
            }
