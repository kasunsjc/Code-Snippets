# Ingress for the Argo CD server, exposed via the AKS managed NGINX add-on
# (Application Routing). TLS is terminated by the nginx controller using the
# default SSL certificate configured on the NginxIngressController CR:
#
#   kubectl patch nginxingresscontroller default --type=merge \
#     -p '{"spec":{"defaultSSLCertificate":{"keyVaultURI":"<kv-cert-uri>"}}}
#
# This matches the Azure Portal flow: domain + KV cert are configured at the
# controller level, so no per-ingress annotation is required.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # Argo CD server speaks HTTPS to its own pod when TLS is enabled; if you
    # disabled internal TLS, change this to HTTP and drop the next annotation.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: argocd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
  tls:
    - hosts:
        - argocd.example.com
      secretName: keyvault-argocd-server-tls
