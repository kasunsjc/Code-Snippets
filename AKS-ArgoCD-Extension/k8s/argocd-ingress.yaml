# Ingress for the Argo CD server, exposed via the AKS managed NGINX add-on
# (Application Routing). TLS is terminated using a certificate stored in
# Azure Key Vault and pulled by the App Routing controller via Secrets Store
# CSI - referenced through the kubernetes.azure.com/tls-cert-keyvault-uri
# annotation.
#
# Replace the annotation value with the output of:
#   terraform output -raw key_vault_certificate_uri
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    kubernetes.azure.com/tls-cert-keyvault-uri: "https://<key-vault-name>.vault.azure.net/certificates/argocd-ingress-tls"
    # Argo CD server speaks HTTPS to its own pod when TLS is enabled; if you
    # disabled internal TLS, change this to HTTP and drop the next annotation.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: argocd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
  tls:
    - hosts:
        - argocd.example.com
      secretName: keyvault-argocd-server-tls
