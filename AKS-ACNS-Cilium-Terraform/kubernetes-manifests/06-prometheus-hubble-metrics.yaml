# Expand the Managed Prometheus keep-list for ACNS network dashboards.
# The default minimal-ingestion profile drops high-cardinality Hubble flow metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v2
  config-version: acns1
  cluster-metrics: |-
    default-targets-scrape-enabled: |-
      kubelet = true
      coredns = false
      cadvisor = true
      kubeproxy = false
      apiserver = false
      kubestate = true
      nodeexporter = true
      windowsexporter = false
      windowskubeproxy = false
      kappiebasic = true
      networkobservabilityRetina = true
      networkobservabilityHubble = true
      networkobservabilityCilium = true
      prometheuscollectorhealth = false
    default-targets-metrics-keep-list: |-
      networkobservabilityHubble = "hubble.*"
      networkobservabilityCilium = "cilium.*"
