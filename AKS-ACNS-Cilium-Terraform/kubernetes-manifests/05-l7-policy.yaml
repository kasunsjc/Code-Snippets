# Layer 7 policy (Container Network Security).
# Only GET /products from http-client is allowed to reach http-server;
# other methods/paths get an HTTP 403 from the Cilium Envoy proxy.
# Requires ACNS advanced network policies set to L7 (see deploy.sh --enable-l7).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-get-products
spec:
  description: "Allow only GET /products from http-client to http-server"
  endpointSelector:
    matchLabels:
      app: http-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: http-client
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/products"
