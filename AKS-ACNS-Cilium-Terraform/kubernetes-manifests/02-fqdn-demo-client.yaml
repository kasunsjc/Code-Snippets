# Test client used for the FQDN filtering demo.
# Deployed in traffic-demo alongside 03-fqdn-filtering-policy.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-client
  namespace: traffic-demo
  labels:
    app: demo-container
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-container
  template:
    metadata:
      labels:
        app: demo-container
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.43
          command: ["sleep", "infinity"]
