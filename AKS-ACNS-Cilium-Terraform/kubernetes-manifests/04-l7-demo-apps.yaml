# HTTP server + client used for the Layer 7 policy demo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 8080;

        location / {
            return 200 "Hello from the server root!\n";
        }

        location /products {
            return 200 "Listing products...\n";
        }

        # Explicit status-code endpoints used by the L7 load generator
        location = /status/200 { return 200 "ok\n"; }
        location = /status/201 { return 201 "created\n"; }
        location = /status/204 { return 204; }
        location = /status/301 { add_header Location /products; return 301; }
        location = /status/302 { add_header Location /products; return 302; }
        location = /status/400 { return 400 "bad request\n"; }
        location = /status/401 { return 401 "unauthorized\n"; }
        location = /status/404 { return 404 "not found\n"; }
        location = /status/418 { return 418; }
        location = /status/429 { return 429 "too many requests\n"; }
        location = /status/500 { return 500 "internal error\n"; }
        location = /status/502 { return 502 "bad gateway\n"; }
        location = /status/503 { return 503 "service unavailable\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  labels:
    app: http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
        - name: http-server
          image: nginx:1.27
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config-volume
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: http-server
spec:
  selector:
    app: http-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-client
  labels:
    app: http-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-client
  template:
    metadata:
      labels:
        app: http-client
    spec:
      containers:
        - name: http-client
          image: curlimages/curl:8.10.1
          command: ["sleep", "infinity"]
