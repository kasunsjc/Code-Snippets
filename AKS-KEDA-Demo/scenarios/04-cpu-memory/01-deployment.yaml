apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-app
  namespace: keda-demo
  labels:
    app: cpu-app
    scenario: cpu-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-app
  template:
    metadata:
      labels:
        app: cpu-app
        scenario: cpu-memory
    spec:
      containers:
        - name: cpu-app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # Resource limits are REQUIRED for CPU/memory scalers.
          # The 'Utilization' metricType is relative to the 'requests' value below.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
