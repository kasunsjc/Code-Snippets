# Producer Job — sends 100 messages to the Azure Service Bus queue.
# Apply this to trigger KEDA scale-out on the servicebus-consumer Deployment.
#
# Apply:  kubectl apply -f 04-producer-job.yaml -n keda-demo
# Logs:   kubectl logs job/servicebus-producer -n keda-demo
apiVersion: batch/v1
kind: Job
metadata:
  name: servicebus-producer
  namespace: keda-demo
  labels:
    app: servicebus-producer
    scenario: service-bus
spec:
  template:
    metadata:
      labels:
        app: servicebus-producer
    spec:
      restartPolicy: Never
      containers:
        - name: producer
          image: python:3.12-slim
          command:
            - /bin/bash
            - -c
            - |
              pip install azure-servicebus --quiet
              python3 - <<'PYEOF'
              import os, time
              from azure.servicebus import ServiceBusClient, ServiceBusMessage

              connection_string = os.environ["SERVICEBUS_CONNECTION_STRING"]
              queue_name = "keda-demo-queue"
              message_count = 100

              print(f"=== Service Bus Producer ===")
              print(f"Sending {message_count} messages to '{queue_name}'...")

              with ServiceBusClient.from_connection_string(connection_string) as client:
                  with client.get_queue_sender(queue_name=queue_name) as sender:
                      for i in range(1, message_count + 1):
                          msg = ServiceBusMessage(
                              body=f"Task-{i}: process item at {time.strftime('%H:%M:%S')}",
                              subject=f"demo-task-{i}"
                          )
                          sender.send_messages(msg)
                          print(f"  Sent message {i}/{message_count}")

              print(f"\nDone! {message_count} messages sent to Service Bus queue.")
              print("KEDA should begin scaling the consumer within one polling interval.")
              PYEOF
          env:
            - name: SERVICEBUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-servicebus-secret
                  key: connection-string
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
