apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicebus-consumer
  namespace: keda-demo
  labels:
    app: servicebus-consumer
    scenario: service-bus
spec:
  replicas: 0    # KEDA owns replica count — start at zero
  selector:
    matchLabels:
      app: servicebus-consumer
  template:
    metadata:
      labels:
        app: servicebus-consumer
        scenario: service-bus
    spec:
      containers:
        - name: servicebus-consumer
          image: python:3.12-slim
          command:
            - /bin/bash
            - -c
            - |
              echo "Installing azure-servicebus..."
              pip install azure-servicebus --quiet
              python3 - <<'PYEOF'
              import os, time
              from azure.servicebus import ServiceBusClient

              connection_string = os.environ["SERVICEBUS_CONNECTION_STRING"]
              queue_name = "keda-demo-queue"

              print(f"Consumer started — pod: {os.environ.get('HOSTNAME', 'unknown')}")
              print(f"Listening on queue: {queue_name}")

              with ServiceBusClient.from_connection_string(connection_string) as client:
                  receiver = client.get_queue_receiver(queue_name=queue_name, max_wait_time=5)
                  with receiver:
                      while True:
                          messages = receiver.receive_messages(max_message_count=5, max_wait_time=5)
                          if messages:
                              for msg in messages:
                                  print(f"  [OK] Received: {str(msg)}")
                                  receiver.complete_message(msg)
                                  time.sleep(0.5)   # simulate processing time
                          else:
                              print(f"  [--] No messages, waiting...")
                              time.sleep(3)
              PYEOF
          env:
            - name: SERVICEBUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-servicebus-secret
                  key: connection-string
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
