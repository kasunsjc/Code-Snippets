# ============================================================
# TEMPLATE ONLY - This file shows the secret structure.
# The actual secret is created by deploy.sh using the real
# Azure Service Bus connection string from Azure CLI.
#
# To create manually:
#   kubectl create secret generic azure-servicebus-secret \
#     --namespace keda-demo \
#     --from-literal=connection-string="Endpoint=sb://<namespace>.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=..."
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: azure-servicebus-secret
  namespace: keda-demo
type: Opaque
stringData:
  connection-string: "<REPLACE_WITH_SERVICEBUS_CONNECTION_STRING>"
