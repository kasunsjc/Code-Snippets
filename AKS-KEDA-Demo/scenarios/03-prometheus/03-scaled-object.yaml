# ScaledObject for Prometheus-based scaling using Azure Managed Prometheus.
#
# KEDA evaluates the PromQL expression every pollingInterval seconds.
# The result is compared to 'threshold' to determine desired replicas:
#
#   desiredReplicas = ceil(queryResult / threshold)
#
# Example:
#   queryResult = 45 req/s  →  ceil(45/10) = 5 replicas
#   queryResult =  8 req/s  →  ceil( 8/10) = 1 replica  (min enforced)
#   queryResult =  0 req/s  →  scales to minReplicaCount (1)
#
# Prerequisites:
#   - Apply 00-workload-identity.yaml (creates the annotated Service Account)
#   - Apply 00-trigger-auth.yaml (TriggerAuthentication using workload identity)
#   - The {{ PROMETHEUS_QUERY_ENDPOINT }} placeholder is substituted by deploy.sh
#     from the Terraform output: prometheus_query_endpoint
#
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prometheus-scaler
  namespace: keda-demo
spec:
  scaleTargetRef:
    name: sample-app

  minReplicaCount: 1      # Keep at least 1 pod (no scale-to-zero here)
  maxReplicaCount: 10

  cooldownPeriod: 90
  pollingInterval: 15

  triggers:
    - type: prometheus
      metadata:
        # Azure Managed Prometheus query endpoint — substituted by deploy.sh.
        serverAddress: "{{ PROMETHEUS_QUERY_ENDPOINT }}"

        # PromQL query — sum RPS across all pods in the keda-demo namespace.
        query: 'sum(rate(http_requests_total{namespace="keda-demo"}[2m]))'

        # KEDA metric name (used internally)
        metricName: http_requests_per_second

        # Target metric value per replica.
        threshold: "10"
      authenticationRef:
        name: azure-managed-prometheus-trigger-auth
