# ============================================================
# Scenario 03 — Workload Identity Service Account
#
# This ServiceAccount is federated with the Azure Managed Identity
# provisioned by Terraform (module.prometheus_workload_identity).
# KEDA's Prometheus scaler uses it to obtain a short-lived token
# for Azure Managed Prometheus — no static secrets required.
#
# The annotation 'azure.workload.identity/client-id' must match
# the Terraform output: prometheus_workload_identity_client_id
# ============================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-prometheus-reader
  namespace: keda-demo
  annotations:
    azure.workload.identity/client-id: "{{ PROMETHEUS_WORKLOAD_IDENTITY_CLIENT_ID }}"
  labels:
    azure.workload.identity/use: "true"
