# ============================================================
# TEMPLATE ONLY - This file shows the secret structure.
# The actual secret is created by deploy.sh using the real
# Azure Storage connection string retrieved from Azure CLI.
#
# To create manually:
#   kubectl create secret generic azure-storage-secret \
#     --namespace keda-demo \
#     --from-literal=connection-string="DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...;EndpointSuffix=core.windows.net"
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-secret
  namespace: keda-demo
type: Opaque
stringData:
  connection-string: "{{ STORAGE_CONNECTION_STRING }}"
