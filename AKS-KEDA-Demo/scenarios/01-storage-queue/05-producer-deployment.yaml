# Continuous producer — sends messages to the Azure Storage Queue at a steady rate.
# This keeps a constant load on the queue so you can observe KEDA scaling the consumer.
#
# Adjust MESSAGE_INTERVAL_SECONDS in the ConfigMap to change the rate:
#   kubectl set env deployment/storage-queue-producer MESSAGE_INTERVAL_SECONDS=1 -n keda-demo
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-queue-producer-config
  namespace: keda-demo
data:
  MESSAGE_INTERVAL_SECONDS: "2"
  BATCH_SIZE: "1"
  LOG_LEVEL: "INFO"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-queue-producer
  namespace: keda-demo
  labels:
    app: storage-queue-producer
    scenario: storage-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-queue-producer
  template:
    metadata:
      labels:
        app: storage-queue-producer
        scenario: storage-queue
    spec:
      containers:
      - name: producer
        image: "{{ ACR_LOGIN_SERVER }}/storage-queue-producer:{{ IMAGE_TAG }}"
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: storage-queue-producer-config
        env:
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-storage-secret
              key: connection-string
        - name: QUEUE_NAME
          value: "keda-demo-queue"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "cat /proc/1/cmdline | grep -q producer.py"
          initialDelaySeconds: 30
          periodSeconds: 60
      restartPolicy: Always
