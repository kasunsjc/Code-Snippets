# Scenario 05 — Azure Event Hub Consumer Secret
#
# This file is a TEMPLATE. deploy.sh creates the real Secret automatically.
# Do NOT apply this file directly — it will create a Secret with placeholder values.
#
# To create the Secret manually:
#
#   EH_CS=$(az eventhubs namespace authorization-rule keys list \
#     --resource-group rg-aks-keda-demo \
#     --namespace-name <namespace> \
#     --name RootManageSharedAccessKey \
#     --query primaryConnectionString -o tsv)
#
#   ST_CS=$(az storage account show-connection-string \
#     --name <storage-account> \
#     --resource-group rg-aks-keda-demo \
#     --query connectionString -o tsv)
#
#   kubectl create secret generic azure-eventhub-secret \
#     --namespace keda-demo \
#     --from-literal=eventhub-connection-string="$EH_CS" \
#     --from-literal=storage-connection-string="$ST_CS" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-eventhub-secret
  namespace: keda-demo
type: Opaque
stringData:
  eventhub-connection-string: "{{ EVENTHUB_CONNECTION_STRING }}"
  storage-connection-string: "{{ STORAGE_CONNECTION_STRING }}"
