# ScaledObject for Prometheus-based scaling.
# KEDA evaluates the PromQL expression every pollingInterval seconds.
# The result is compared to 'threshold' to determine desired replicas:
#
#   desiredReplicas = ceil(queryResult / threshold)
#
# Example:
#   queryResult = 45 req/s  →  ceil(45/10) = 5 replicas
#   queryResult =  8 req/s  →  ceil( 8/10) = 1 replica  (min enforced)
#   queryResult =  0 req/s  →  scales to minReplicaCount (1)
#
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prometheus-scaler
  namespace: keda-demo
spec:
  scaleTargetRef:
    name: sample-app

  minReplicaCount: 1      # Keep at least 1 pod (no scale-to-zero here)
  maxReplicaCount: 10

  cooldownPeriod: 90
  pollingInterval: 15

  triggers:
    - type: prometheus
      metadata:
        # Address of the Prometheus server inside the cluster.
        # Adjust to match your Prometheus installation namespace/service name.
        serverAddress: http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090

        # PromQL query — sum RPS across all pods in the keda-demo namespace.
        # The [2m] range smooths out spikes.
        query: 'sum(rate(http_requests_total{namespace="keda-demo"}[2m]))'

        # KEDA metric name (used internally)
        metricName: http_requests_per_second

        # Target metric value per replica.
        # 1 replica handles 10 req/s in this scenario.
        threshold: "10"
