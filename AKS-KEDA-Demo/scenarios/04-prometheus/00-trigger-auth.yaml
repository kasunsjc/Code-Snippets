# ============================================================
# Scenario 04 — Azure Managed Prometheus Authentication
#
# KEDA uses a bearer token to authenticate against the
# Azure Managed Prometheus query endpoint.
#
# Steps to populate the bearer token:
#
#   TOKEN=$(az account get-access-token \
#     --resource https://prometheus.monitor.azure.com \
#     --query accessToken -o tsv)
#
#   kubectl create secret generic azure-managed-prometheus-secret \
#     --namespace keda-demo \
#     --from-literal=bearerToken="$TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Note: Access tokens expire after ~1 hour. For production use,
# replace this with a solution that auto-refreshes tokens, such as
# azure/azure-workload-identity sidecar or oauth2-proxy.
# ============================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-managed-prometheus-secret
  namespace: keda-demo
  annotations:
    # Placeholder — replace with a real token before applying.
    # See the instructions in this file header.
    demo/populate-with: "az account get-access-token --resource https://prometheus.monitor.azure.com"
type: Opaque
stringData:
  bearerToken: "<REPLACE_WITH_TOKEN>"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: azure-managed-prometheus-trigger-auth
  namespace: keda-demo
spec:
  secretTargetRef:
    - parameter: bearerToken
      name: azure-managed-prometheus-secret
      key: bearerToken
