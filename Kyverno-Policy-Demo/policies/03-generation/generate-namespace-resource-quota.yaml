apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-namespace-resource-quota
  annotations:
    policies.kyverno.io/title: Generate Default ResourceQuota
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, ResourceQuota
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Uncontrolled resource consumption can starve other workloads. This
      generation policy creates a default ResourceQuota in every new namespace
      to cap total CPU, memory, and number of Pods. Namespace owners can
      request higher limits through a formal capacity planning process.
spec:
  background: false
  rules:
    - name: generate-resource-quota
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: default-quota
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              managed-by: kyverno
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 4Gi
              limits.cpu: "8"
              limits.memory: 8Gi
              pods: "20"
              services: "10"
              persistentvolumeclaims: "5"
