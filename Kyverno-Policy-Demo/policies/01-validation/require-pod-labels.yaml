apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-labels
  annotations:
    policies.kyverno.io/title: Require Pod Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Labels are the standard mechanism for grouping and selecting Kubernetes
      workloads. This policy requires all Pods to carry the labels `app`,
      `version`, and `owner` to enable effective filtering, monitoring, and
      cost attribution.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          The labels 'app', 'version', and 'owner' are required on every Pod.
          Add them under spec.template.metadata.labels in your workload manifest.
        pattern:
          metadata:
            labels:
              app: "?*"
              version: "?*"
              owner: "?*"
