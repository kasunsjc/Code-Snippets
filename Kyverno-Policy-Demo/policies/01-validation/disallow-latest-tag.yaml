apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      The ':latest' image tag is mutable and unpredictable; it breaks
      reproducibility and makes rollbacks unreliable. This policy blocks
      Pods that use images tagged ':latest' or images with no tag at all
      (which implicitly pull ':latest').
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Using the ':latest' image tag or an untagged image is not allowed.
          Pin the image to a specific immutable tag (e.g., nginx:1.27.0) or
          a digest (e.g., nginx@sha256:...).
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: NotContains
                    value: ":"
