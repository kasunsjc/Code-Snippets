# Sample workload designed to trigger common Falco rules:
#   - "Read sensitive file untrusted" (reads /etc/shadow)
#   - "Launch Privileged Container" (privileged: true)
#   - "Terminal shell in container" (when you exec)
#   - "Write below etc" (writes to /etc)
#
# Apply with:    kubectl apply -f sample-attacks/attack-pod.yaml
# Trigger:       kubectl exec -it falco-attack -- sh -c "cat /etc/shadow; echo evil >> /etc/hosts; nc -lp 4444 &"
# Cleanup:       kubectl delete -f sample-attacks/attack-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: falco-attack
  labels:
    app: falco-attack
    purpose: runtime-security-demo
spec:
  hostPID: false
  containers:
    - name: attacker
      image: alpine:3.20
      command: ["sh", "-c", "apk add --no-cache busybox-extras netcat-openbsd >/dev/null 2>&1 || true; sleep infinity"]
      securityContext:
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  restartPolicy: Always
