apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdropallcapabilities
  annotations:
    metadata.gatekeeper.sh/title: "Drop All Linux Capabilities"
    description: >-
      Requires every Pod container to drop all Linux capabilities.
spec:
  crd:
    spec:
      names:
        kind: K8sDropAllCapabilities
      validation:
        openAPIV3Schema:
          type: object
          properties: {}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdropallcapabilities

        violation[{"msg": msg}] {
          c := input_containers[_]
          not capability_dropped(c)
          msg := sprintf("Pod <%v> in namespace <%v>, container <%v> must drop all Linux capabilities with securityContext.capabilities.drop: [ALL]", [input.review.object.metadata.name, input.review.object.metadata.namespace, c.name])
        }

        capability_dropped(c) {
          c.securityContext.capabilities.drop[_] == "ALL"
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
