apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsphostnamespace
  annotations:
    metadata.gatekeeper.sh/title: "Host Namespace"
    description: >-
      Disallows sharing of host PID and IPC namespaces by pod containers.
      Corresponds to the `hostPID` and `hostIPC` fields in a PodSecurityPolicy.
spec:
  crd:
    spec:
      names:
        kind: K8sPSPHostNamespace
      validation:
        openAPIV3Schema:
          type: object
          properties: {}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsphostnamespace

        import data.lib.exclude_update.is_update

        violation[{"msg": msg, "details": {}}] {
          # spec.hostPID and spec.hostIPC fields are immutable.
          not is_update(input.review)

          input_share_hostnamespace(input.review.object)
          msg := sprintf("Pod <%v> in namespace <%v> shares a host PID or IPC namespace; set hostPID and hostIPC to false", [input.review.object.metadata.name, input.review.object.metadata.namespace])
        }

        input_share_hostnamespace(o) {
          o.spec.hostPID
        }
        input_share_hostnamespace(o) {
          o.spec.hostIPC
        }
      libs:
        - |
          package lib.exclude_update

          is_update(review) {
            review.operation == "UPDATE"
          }
