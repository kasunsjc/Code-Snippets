apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdenyhostports
  annotations:
    metadata.gatekeeper.sh/title: "Deny Host Ports"
    description: >-
      Disallows binding a container port directly to a port on the node via
      hostPort.
spec:
  crd:
    spec:
      names:
        kind: K8sDenyHostPorts
      validation:
        openAPIV3Schema:
          type: object
          properties: {}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdenyhostports

        violation[{"msg": msg}] {
          c := input_containers[_]
          p := c.ports[_]
          p.hostPort
          p.hostPort != 0
          msg := sprintf("Pod <%v> in namespace <%v>, container <%v> binds hostPort <%v>; remove hostPort so the container does not bind directly to the node network interface", [input.review.object.metadata.name, input.review.object.metadata.namespace, c.name, p.hostPort])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
