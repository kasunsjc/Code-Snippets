# Violates: require-readonly-root-fs (custom policy, K8sPSPReadOnlyRootFilesystem)
apiVersion: v1
kind: Pod
metadata:
  name: bad-writable-root-fs
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:1.27-alpine
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: false
