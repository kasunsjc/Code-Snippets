# Violates: allowed-repos (custom policy, K8sAllowedRepos) - image doesn't start with an allowed repo prefix
apiVersion: v1
kind: Pod
metadata:
  name: bad-disallowed-image
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  containers:
    - name: app
      image: example.io/random-registry/app:latest
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
      securityContext:
        readOnlyRootFilesystem: true
