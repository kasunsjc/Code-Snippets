# Violates: deny-latest-image-tags (custom policy, K8sDenyLatestImageTags)
apiVersion: v1
kind: Pod
metadata:
  name: bad-latest-tag
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: docker.io/library/nginx:latest
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
