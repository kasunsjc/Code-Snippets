# Violates: deny-privileged-containers (custom policy, K8sPSPPrivilegedContainer)
apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27-alpine
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
      securityContext:
        privileged: true
        readOnlyRootFilesystem: true
