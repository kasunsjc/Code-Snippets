# Violates: require-seccomp-runtime-default (custom policy, K8sRequireSeccompRuntimeDefault)
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-seccomp
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:1.27-alpine
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 101
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
  volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
