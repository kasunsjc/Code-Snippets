# Violates: require-team-labels (custom OPA/Rego policy) - missing required labels
apiVersion: v1
kind: Pod
metadata:
  name: bad-missing-labels
  namespace: workloads
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:1.27-alpine
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
  volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
