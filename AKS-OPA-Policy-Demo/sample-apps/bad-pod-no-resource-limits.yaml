# Violates: require-resource-limits (custom policy, K8sContainerLimits) - no cpu/memory limits set
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-resource-limits
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:1.27-alpine
    securityContext:
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
  volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
