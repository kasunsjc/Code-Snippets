# Violates: deny-host-namespaces (custom policy, K8sPSPHostNamespace checks hostPID/hostIPC)
apiVersion: v1
kind: Pod
metadata:
  name: bad-host-namespace
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  hostPID: true
  containers:
  - name: nginx
    image: docker.io/library/nginx:1.27-alpine
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
  volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
