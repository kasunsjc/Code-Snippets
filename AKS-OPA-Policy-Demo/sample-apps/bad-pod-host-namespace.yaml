# Violates: deny-host-namespaces (custom policy, K8sPSPHostNamespace checks hostPID/hostIPC)
apiVersion: v1
kind: Pod
metadata:
  name: bad-host-namespace
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  hostPID: true
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27-alpine
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
      securityContext:
        readOnlyRootFilesystem: true
