# Violates: deny-host-network (custom policy, K8sDenyHostNetwork)
apiVersion: v1
kind: Pod
metadata:
  name: bad-host-network
  namespace: workloads
  labels:
    team: platform
    environment: dev
spec:
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27-alpine
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
