apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: breakpoint-test
  namespace: k6-tests
spec:
  # Single pod — breakpoint tests need a single coordinated ramp
  parallelism: 1
  script:
    configMap:
      name: k6-breakpoint-test
      file: breakpoint-test.js
  runner:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
