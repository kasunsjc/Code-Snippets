apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-soak-test
  namespace: k6-tests
data:
  soak-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    // Sustained load over 20 minutes to expose memory leaks and
    // connection pool exhaustion that only appear under prolonged usage.
    export const options = {
      stages: [
        { duration: '2m',  target: 50 },
        { duration: '20m', target: 50 },
        { duration: '2m',  target: 0  },
      ],
      thresholds: {
        http_req_duration: ['p(95)<1000'],
        http_req_failed:   ['rate<0.01'],
      },
    };

    const BASE_URL = 'http://httpbin.demo-apps.svc.cluster.local';

    export default function () {
      const res = http.get(`${BASE_URL}/get`);
      check(res, {
        'status is 200':         (r) => r.status === 200,
        'response time < 1s':    (r) => r.timings.duration < 1000,
      });
      sleep(1);
    }
