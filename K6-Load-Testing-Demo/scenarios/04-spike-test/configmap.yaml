apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-spike-test
  namespace: k6-tests
data:
  spike-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    // Two sudden traffic spikes simulate a flash-sale or viral event.
    export const options = {
      stages: [
        { duration: '1m',  target: 20  },   // warm-up
        { duration: '30s', target: 500 },   // spike 1
        { duration: '1m',  target: 20  },   // recover
        { duration: '30s', target: 500 },   // spike 2
        { duration: '2m',  target: 20  },   // recover
        { duration: '1m',  target: 0   },   // ramp down
      ],
      thresholds: {
        http_req_duration: ['p(95)<3000'],
        http_req_failed:   ['rate<0.10'],
      },
    };

    const BASE_URL = 'http://httpbin.demo-apps.svc.cluster.local';

    export default function () {
      const res = http.get(`${BASE_URL}/get`);
      check(res, {
        'status is 200': (r) => r.status === 200,
      });
      sleep(0.2);
    }
