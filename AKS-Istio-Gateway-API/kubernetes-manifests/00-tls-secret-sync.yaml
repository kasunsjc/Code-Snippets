# Helper pod to sync TLS certificate from Key Vault to Kubernetes Secret
# This pod mounts the SecretProviderClass volume which triggers the creation
# of the kubernetes.io/tls secret that can be used by the Gateway
apiVersion: v1
kind: Pod
metadata:
  name: tls-secret-sync
  namespace: default
  labels:
    app: tls-secret-sync
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command:
    - "/bin/sh"
    - "-c"
    - "echo 'Certificate synced to Kubernetes secret: gateway-tls-secret' && sleep infinity"
    volumeMounts:
    - name: secrets-store
      mountPath: "/mnt/secrets-store"
      readOnly: true
  volumes:
  - name: secrets-store
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "gateway-tls-cert-spc"
