---
# Sample application 1 - Echo service
apiVersion: v1
kind: Service
metadata:
  name: echo-v1
  namespace: default
  labels:
    app: echo
    version: v1
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: echo
    version: v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
      version: v1
  template:
    metadata:
      labels:
        app: echo
        version: v1
    spec:
      containers:
      - name: echo
        image: ealen/echo-server:0.6.0
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: ECHO_MESSAGE
          value: "Hello from Echo v1"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
# Sample application 2 - Echo service v2 (for traffic splitting demos)
apiVersion: v1
kind: Service
metadata:
  name: echo-v2
  namespace: default
  labels:
    app: echo
    version: v2
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: echo
    version: v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v2
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
      version: v2
  template:
    metadata:
      labels:
        app: echo
        version: v2
    spec:
      containers:
      - name: echo
        image: ealen/echo-server:0.6.0
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: ECHO_MESSAGE
          value: "Hello from Echo v2"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
