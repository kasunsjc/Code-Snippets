---
# HTTPRoute with path-based routing to multiple services
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multi-service-routing
  namespace: default
spec:
  parentRefs:
  - name: echo-gateway
  hostnames:
  - "app.example.com"
  rules:
  # Route /v1/* to echo-v1
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: echo-v1
      port: 80
  # Route /v2/* to echo-v2
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    - name: echo-v2
      port: 80
  # Route /httpbin/* to httpbin
  - matches:
    - path:
        type: PathPrefix
        value: /httpbin
    backendRefs:
    - name: httpbin
      port: 8000
