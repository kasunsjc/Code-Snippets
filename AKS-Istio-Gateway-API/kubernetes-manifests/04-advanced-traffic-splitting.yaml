---
# Advanced HTTPRoute demonstrating traffic splitting (canary deployment)
# This route splits traffic 90/10 between v1 and v2
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: echo-gateway
  namespace: default
spec:
  gatewayClassName: approuting-istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-canary
  namespace: default
spec:
  parentRefs:
  - name: echo-gateway
  hostnames:
  - "echo.example.com"
  rules:
  # Traffic splitting: 90% to v1, 10% to v2
  - backendRefs:
    - name: echo-v1
      port: 80
      weight: 90
    - name: echo-v2
      port: 80
      weight: 10
