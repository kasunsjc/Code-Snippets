apiVersion: azmonitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik-azure-monitor
  namespace: traefik
spec:
  jobLabel: azure-monitor-job
  labelLimit: 63
  labelNameLengthLimit: 511
  labelValueLengthLimit: 1023
  selector:
    matchLabels:
      azure-monitor-job: traefik
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          action: keep
          regex: traefik_.+