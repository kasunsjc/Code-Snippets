apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: httpbin-slo-breach
  namespace: k6-demo
spec:
  parallelism: 1
  runner:
    env:
      - name: BASE_URL
        value: "https://httpbin.kasunrajapakse.xyz"
      - name: DURATION
        value: "6m"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  script:
    configMap:
      name: k6-slo-breach-script
      file: slo-breach.js