# Supplied at install time; credentials are referenced, never embedded.
githubConfigUrl: ""
githubConfigSecret: github-auth
# GITHUB_RUNNER_GROUP is supplied by the installer for enterprise / organization scope.
runnerScaleSetName: aks-arc-runners
minRunners: 0
maxRunners: 5
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller

listenerTemplate:
  spec:
    nodeSelector:
      workload: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi

containerMode:
  type: kubernetes
  kubernetesModeWorkVolumeClaim:
    accessModes: [ReadWriteMany]
    storageClassName: arc-azurefile-premium
    resources:
      requests:
        storage: 100Gi
template:
  metadata:
    labels:
      demo: aks-gha-runner
  spec:
    nodeSelector:
      workload: github-actions
      kubernetes.io/arch: amd64
    tolerations:
      - key: workload
        operator: Equal
        value: github-actions
        effect: NoSchedule
    securityContext:
      fsGroup: 123
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0
        command: [/home/runner/run.sh]
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/container-config/container-podspec.yaml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: hook-extension
            mountPath: /home/runner/container-config
            readOnly: true
    volumes:
      - name: hook-extension
        configMap:
          name: hook-extension
