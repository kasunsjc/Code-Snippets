# Runner hooks need the Kubernetes API; job containers do not.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner-egress
  namespace: arc-runners
spec:
  endpointSelector:
    matchLabels:
      demo: aks-gha-runner
  ingress: []
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities: [world]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: job-egress
  namespace: arc-runners
spec:
  endpointSelector:
    matchLabels:
      demo: aks-gha-job
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities: [world]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
