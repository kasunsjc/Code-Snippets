# Karpenter (node autoprovisioning) NodePool for AKS Automatic.
# Runner and job pods select workload=github-actions and tolerate the taint, so
# AKS provisions dedicated amd64 on-demand nodes for jobs and removes them when idle.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: github-actions
spec:
  template:
    metadata:
      labels:
        workload: github-actions
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: default
      taints:
        - key: workload
          value: github-actions
          effect: NoSchedule
      expireAfter: 168h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.azure.com/sku-family
          operator: In
          values: [D]
        - key: karpenter.azure.com/sku-cpu
          operator: In
          values: ["2", "4", "8"]
  # Caps total runner capacity (5 runners x 1 vCPU limit plus job pods).
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
