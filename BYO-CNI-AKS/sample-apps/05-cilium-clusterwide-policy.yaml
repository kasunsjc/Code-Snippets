---
# Cilium Cluster-wide Network Policy: Default deny all ingress
# Apply this to enforce zero-trust networking across the cluster
# kube-system is excluded from the selector: restricting CoreDNS ingress to
# kube-system sources would break DNS for every other namespace
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
