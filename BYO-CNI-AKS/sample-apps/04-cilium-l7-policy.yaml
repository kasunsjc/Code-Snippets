---
# Cilium Network Policy: L7 HTTP-aware policy
# Only allow GET and POST on specific paths to the backend-api
# NOTE: This policy is for demonstration of L7 capabilities.
# For demo nginx pods, use 02-cilium-l3-l4-policy.yaml instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-api-l7-policy
  namespace: cilium-demo
spec:
  endpointSelector:
    matchLabels:
      app: backend-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: frontend
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              # Allow all GET requests (for demo nginx)
              - method: GET
              # Allow POST to API paths
              - method: POST
                path: "/api/.*"
