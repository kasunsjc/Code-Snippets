# vcluster configuration for Team Beta
# Use the stable baseline resources used by other demos

controlPlane:
  statefulSet:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    labels:
      tenant: team-beta
      tier: basic

sync:
  fromHost:
    nodes:
      enabled: true
      selector:
        all: true
  toHost:
    services:
      enabled: true
    persistentVolumeClaims:
      enabled: true
    configMaps:
      enabled: true
    secrets:
      enabled: true
    networkPolicies:
      enabled: true
