---
# test-secret-host.yaml
# Create this on the HOST in namespace vc-sync.
# It will be synced INTO the vcluster's kube-system namespace.
# NOTE: In production use Azure Key Vault or similar — never hardcode real credentials.

apiVersion: v1
kind: Secret
metadata:
  name: shared-platform-secret
  namespace: vc-sync
  labels:
    sync-to-vcluster: "true"
type: Opaque
stringData:
  # These are demo/placeholder values only
  container-registry-server: "myregistry.azurecr.io"
  container-registry-username: "demo-user"
  container-registry-password: "REPLACE_WITH_REAL_VALUE"
  # In production: use Azure Workload Identity / Managed Identity instead of passwords
