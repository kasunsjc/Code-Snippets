# etcd-values.yaml — vcluster configured with deployed (external) etcd backing store
#
# DEFAULT (SQLite):
#   vcluster stores all Kubernetes state in a single SQLite file inside the
#   control plane pod.  Simple and lightweight but:
#     - Single replica only (no HA)
#     - State stored on ephemeral pod storage unless PVC is attached
#     - SQLite WAL file can grow unbounded under heavy write load
#
# THIS CONFIG (Deployed etcd):
#   Replaces SQLite with a dedicated etcd StatefulSet on the host cluster.
#   Benefits:
#     - Enables High Availability (multiple control plane replicas)
#     - Battle-tested Kubernetes-native datastore
#     - Supports etcd snapshot/restore workflows
#     - Suitable for production workloads requiring persistence guarantees
#   Trade-off:
#     - Higher memory footprint (~50–100 MB per replica vs ~10 MB for SQLite)
#     - Requires a PVC per replica for durable storage

controlPlane:
  # ── Backing store ────────────────────────────────────────────────────────────
  backingStore:
    etcd:
      # deploy.enabled=true uses an external etcd StatefulSet managed by vcluster.
      deploy:
        enabled: true
        statefulSet:
          highAvailability:
            replicas: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          persistence:
            volumeClaim:
              enabled: true
              # storageClass: leave empty to use the cluster default StorageClass.
              # For AKS this defaults to Azure Disk (managed-csi).
              storageClass: ""
              size: 5Gi
              accessModes:
                - ReadWriteOnce

  # ── High Availability ────────────────────────────────────────────────────────
  statefulSet:
    # Run 3 vcluster control plane replicas for HA.
    highAvailability:
      replicas: 3

    # Resource requests/limits for each control plane replica
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# ── Sync configuration ───────────────────────────────────────────────────────
sync:
  fromHost:
    nodes:
      enabled: true
      selector:
        all: true
    storageClasses:
      enabled: true

  toHost:
    services:
      enabled: true
    persistentVolumeClaims:
      enabled: true
    configMaps:
      enabled: true
    secrets:
      enabled: true
    ingresses:
      enabled: false
    networkPolicies:
      enabled: true
