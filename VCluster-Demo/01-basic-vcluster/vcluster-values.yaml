controlPlane:
  # Resource requests/limits for the vcluster control plane StatefulSet
  statefulSet:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# sync — controls what the vcluster syncs to/from the host cluster
sync:
  # fromHost: what the vcluster can "see" from the host
  fromHost:
    nodes:
      enabled: true
      # Sync all host nodes so vcluster pods can be scheduled on them
      selector:
        all: true

  # toHost: what gets synced INTO the host cluster namespace
  toHost:
    services:
      enabled: true
    persistentVolumeClaims:
      enabled: true
    ingresses:
      enabled: false    # enabled in demo 05
    networkPolicies:
      enabled: true
    configMaps:
      enabled: true
    secrets:
      enabled: true
